    <style>
      /* 首帧兜底：避免白屏闪烁（React 挂载后由启动加载页接管） */
      @font-face {
        font-family: "Nunito";
        font-style: normal;
        font-weight: 200 1000;
        font-display: swap;
        src: url("/fonts/nunito-latin.woff2") format("woff2");
        unicode-range: U+0020-007E;
      }
      :root {
        color-scheme: light;
        --boot-bg: #f5f5f2;
        --boot-surface: #ffffff;
        --boot-text: #0b1b4d;
        --boot-muted: #4a5a8c;
        --boot-brand: #1e6bff;
        --boot-accent: #ffc933;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --boot-bg: #101114;
        --boot-surface: #111a2c;
        --boot-text: #eef3ff;
        --boot-muted: #98a5c0;
        --boot-brand: #4d8dff;
        --boot-accent: #ffcf57;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--boot-bg);
        color: var(--boot-text);
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI",
          system-ui, sans-serif;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: var(--boot-bg);
      }
      #boot-splash .boot-mark {
        width: 112px;
        height: 112px;
        animation: boot-mark-in 0.5s cubic-bezier(0.22, 0.7, 0.3, 1) both;
      }
      #boot-splash .boot-mark-bg {
        fill: var(--boot-brand);
      }
      #boot-splash .boot-coin {
        fill: var(--boot-accent);
        transform-box: fill-box;
        transform-origin: center;
        animation: boot-coin-flip 1.15s cubic-bezier(0.22, 0.7, 0.3, 1) 0.3s both;
      }
      #boot-splash .boot-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        animation: boot-word-in 0.5s ease-out 0.45s both;
      }
      #boot-splash .boot-wordmark {
        display: flex;
        align-items: baseline;
        font-family:
          "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", system-ui, sans-serif;
        font-weight: 800;
        font-size: 76px;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      #boot-splash .boot-wordmark .gzs {
        color: var(--boot-text);
      }
      #boot-splash .boot-wordmark .pay {
        color: var(--boot-brand);
      }
      #boot-splash .boot-tagline {
        margin: 0;
        font-family:
          "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", system-ui, sans-serif;
        font-weight: 800;
        font-size: 11px;
        line-height: 1;
        letter-spacing: 0.38em;
        text-transform: uppercase;
        color: var(--boot-muted);
      }
      #boot-bar {
        width: 132px;
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: color-mix(in srgb, var(--boot-brand) 16%, transparent);
      }
      #boot-bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: var(--boot-brand);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }
      @keyframes boot-mark-in {
        0% {
          opacity: 0;
          transform: scale(0.82) translateY(8px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      @keyframes boot-coin-flip {
        0% {
          opacity: 0;
          transform: scale(0.3) rotateY(0deg);
        }
        25% {
          opacity: 1;
        }
        70% {
          transform: scale(1.12) rotateY(300deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotateY(360deg);
        }
      }
      @keyframes boot-word-in {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      #boot-icp {
        position: fixed;
        left: 0;
        right: 0;
        bottom: max(env(safe-area-inset-bottom), 18px);
        display: none;
        text-align: center;
        font-size: 10px;
        letter-spacing: 0.02em;
        color: var(--boot-muted);
        text-decoration: none;
      }
      #boot-icp:hover {
        color: var(--boot-text);
      }
      @media (max-width: 359px) {
        #boot-splash {
          gap: 12px;
          padding: 0 12px;
        }
        #boot-splash .boot-mark {
          width: 64px;
          height: 64px;
        }
        #boot-splash .boot-brand {
          gap: 6px;
        }
        #boot-splash .boot-wordmark {
          font-size: 40px;
        }
        #boot-splash .boot-tagline {
          font-size: 8px;
          letter-spacing: 0.3em;
        }
        #boot-bar {
          width: 92px;
          height: 3px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-mark,
        #boot-splash .boot-coin,
        #boot-splash .boot-brand {
          animation: none !important;
        }
      }
    </style>
    <script src="/theme-boot.js"></script>

  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <svg class="boot-mark" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <rect class="boot-mark-bg" width="120" height="120" rx="30" />
        <g fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round">
          <circle class="boot-coin" cx="60" cy="50" r="19" />
          <path d="M79 50V74a16 16 0 0 1-16 16H49" />
        </g>
      </svg>
      <div class="boot-brand">
        <span class="boot-wordmark"><span class="gzs">gzs</span><span class="pay">pay</span></span>
        <p class="boot-tagline">CAMPUS SERVICE</p>
      </div>
      <div id="boot-bar"><i></i></div>
      <a
        id="boot-icp"
        href="https://beian.miit.gov.cn/"
        target="_blank"
        rel="noreferrer noopener"
      ></a>
    </div>
    <noscript>gzspay 需要启用 JavaScript 才能使用。</noscript>
    <script>
      // 开屏底部备案号：初始化状态接口对未初始化也放行，读取失败则保持隐藏
      (function () {
        fetch("/api/setup/status", { headers: { accept: "application/json" } })
          .then(function (res) {
            return res.ok ? res.json() : null;
          })
          .then(function (data) {
            var icp = data && data.system && data.system.icp;
            var el = document.getElementById("boot-icp");
            if (!icp || !el) return;
            el.textContent = icp;
            el.style.display = "block";
          })
          .catch(function () {});
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
