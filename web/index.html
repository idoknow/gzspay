<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>gzspay · 桂中校园收付款</title>
    <meta name="description" content="桂中校园收付款网页应用：扫码认人、下单、第三方收款码付款，资金不经过 gzspay。" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="gzspay" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1020" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <style>
      /* 首帧兜底：避免白屏闪烁（React 挂载后由启动加载页接管） */
      :root {
        color-scheme: light;
        --boot-bg: #f4f6fb;
        --boot-surface: #ffffff;
        --boot-text: #131a2a;
        --boot-muted: #6b7488;
        --boot-brand: #2f6bff;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --boot-bg: #0a1020;
        --boot-surface: #111a2c;
        --boot-text: #eef3ff;
        --boot-muted: #98a5c0;
        --boot-brand: #5b93ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--boot-bg);
        color: var(--boot-text);
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI",
          system-ui, sans-serif;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: var(--boot-bg);
      }
      #boot-splash svg {
        width: 88px;
        height: 88px;
      }
      #boot-splash p {
        margin: 0;
        font-size: 15px;
        color: var(--boot-muted);
        letter-spacing: 0.08em;
      }
      #boot-bar {
        width: 132px;
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: color-mix(in srgb, var(--boot-brand) 16%, transparent);
      }
      #boot-bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: var(--boot-brand);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>
    <script>
      // 主题先行：在 React 之前写入 data-theme，避免首帧主题闪动
      (function () {
        try {
          var mode = localStorage.getItem("gzspay-theme") || "auto";
          var dark =
            mode === "dark" ||
            (mode === "auto" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="boot-logo-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3f8cff" />
            <stop offset="1" stop-color="#1d55e8" />
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="18" fill="url(#boot-logo-grad)" />
        <text
          x="30"
          y="47"
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="42"
          font-weight="800"
          fill="#ffffff"
        >
          g
        </text>
        <circle cx="39" cy="34" r="9" fill="#ffc133" />
      </svg>
      <p>gzspay</p>
      <div id="boot-bar"><i></i></div>
    </div>
    <noscript>gzspay 需要启用 JavaScript 才能使用。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
